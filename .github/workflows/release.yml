name: Release the Lively wallpaper

# Push a tag like v1.0.1 and this builds rikatrix.zip and attaches it to a GitHub release.
# The "latest" download link on the showcase page always points at the newest one.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Zip the Lively package
        run: cd dist && zip -r ../rikatrix.zip .
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" rikatrix.zip --title "Rikatrix $GITHUB_REF_NAME" --generate-notes
